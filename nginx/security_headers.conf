# =============================================================================
# nginx/security_headers.conf
# Security headers applied to all HTTPS responses.
# Included by whatsapp.conf via:  include /etc/nginx/snippets/security_headers.conf;
# =============================================================================

# Prevent clickjacking.
add_header X-Frame-Options "DENY" always;

# Prevent MIME type sniffing.
add_header X-Content-Type-Options "nosniff" always;

# XSS protection (legacy browsers).
add_header X-XSS-Protection "1; mode=block" always;

# Referrer policy — do not leak internal URLs.
add_header Referrer-Policy "no-referrer" always;

# Permissions policy — disable unused browser features.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# Content Security Policy.
# This is a backend API — no scripts, images, or frames needed.
add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none';" always;
