# =============================================================================
# nginx/whatsapp.conf
# Nginx configuration for the Market Intel WhatsApp Service.
#
# Security design:
# - HTTP (80) redirects to HTTPS (443) only.
# - WAHA API (/api/*) is proxied to the internal Docker container.
# - WAHA Dashboard (/dashboard/) is proxied with IP restriction.
# - QR endpoint (/api/sessions/*/qr*) is available only to Django backend.
# - No directory listing, no server version, no caching of auth responses.
# - Request size limited to 10MB (sufficient for media, rejects oversized req).
# =============================================================================

# ---------------------------------------------------------------------------
# Upstream: WAHA container on the internal Docker network.
# The 'waha' hostname is resolved by Docker's internal DNS.
# Port 3000 is NOT exposed to the public Internet.
# ---------------------------------------------------------------------------
upstream waha_backend {
    server waha:3000;
    keepalive 16;
}

# ---------------------------------------------------------------------------
# Rate limiting zones
# ---------------------------------------------------------------------------
# General API rate limit: 60 requests per minute per IP.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;

# Stricter limit for session/auth-sensitive endpoints.
limit_req_zone $binary_remote_addr zone=session_limit:10m rate=10r/m;

# ---------------------------------------------------------------------------
# HTTP server: redirect all traffic to HTTPS.
# Only the ACME webroot challenge (.well-known/acme-challenge) is served.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name ${NGINX_SERVER_NAME};

    # Serve Let's Encrypt ACME challenge for certificate renewal.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Nginx internal health check (no public auth required).
    location /health-check {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Redirect everything else to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS server: TLS termination + WAHA proxy.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name ${NGINX_SERVER_NAME};

    # ── TLS ─────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/${NGINX_SERVER_NAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${NGINX_SERVER_NAME}/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/${NGINX_SERVER_NAME}/chain.pem;

    # Modern TLS configuration.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # HSTS: tell browsers to use HTTPS for 1 year.
    # Add includeSubDomains and preload ONLY after verifying the entire domain.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # OCSP stapling (reduces TLS handshake latency).
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # ── Security headers ────────────────────────────────────────────────────
    include /etc/nginx/snippets/security_headers.conf;

    # ── Global limits ────────────────────────────────────────────────────────
    client_max_body_size 10M;
    client_body_timeout 30s;
    client_header_timeout 15s;
    send_timeout 30s;

    # Hide Nginx version.
    server_tokens off;

    # ── Nginx internal health check ─────────────────────────────────────────
    location /health-check {
        return 200 "ok\n";
        add_header Content-Type text/plain;
        access_log off;
    }

    # ── WAHA Dashboard — restricted access ──────────────────────────────────
    # The dashboard is protected at the Nginx layer.
    # If a VPN/IP restriction is configured, uncomment and adjust allow/deny.
    location /dashboard/ {
        # Uncomment to restrict dashboard to specific IPs (recommended):
        # allow 203.0.113.1;     # Django backend server IP
        # allow 203.0.113.2;     # Admin IP
        # deny all;

        limit_req zone=session_limit burst=5 nodelay;

        proxy_pass http://waha_backend/dashboard/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # No caching for dashboard responses.
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # ── WAHA API — main proxy ────────────────────────────────────────────────
    # All /api/* requests are proxied to WAHA.
    # WAHA itself validates the X-Api-Key header.
    # Django is the only caller authorized to use the API key.
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://waha_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass the API key header through.
        # WAHA requires X-Api-Key.
        proxy_pass_header X-Api-Key;

        # Disable proxy buffering for streaming/SSE responses if needed.
        proxy_buffering off;
        proxy_request_buffering off;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Prevent caching of authenticated API responses.
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;

        # Do not expose internal error details.
        proxy_intercept_errors on;
        error_page 502 503 504 = @service_unavailable;
    }

    # ── WAHA Health endpoint (unauthenticated, used for monitoring) ──────────
    location /health {
        proxy_pass http://waha_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
        access_log off;
    }

    # ── Block direct access to everything else ──────────────────────────────
    location / {
        return 404;
    }

    # ── Custom error page for upstream failures ─────────────────────────────
    location @service_unavailable {
        internal;
        return 503 '{"detail":"Service temporarily unavailable."}';
        add_header Content-Type application/json always;
    }

    # ── Access logging ───────────────────────────────────────────────────────
    access_log /var/log/nginx/whatsapp-access.log combined;
    error_log  /var/log/nginx/whatsapp-error.log warn;
}
